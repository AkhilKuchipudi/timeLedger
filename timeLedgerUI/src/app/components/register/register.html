<div class="authContainer">

    <div class="authContent glassPanel">
        <h1 class="authTitle">Create Account</h1>
        <p class="authSubtitle">Start tracking your productivity today</p>
        
        <div class="accountTypeToggle">
            <button type="button" [class.active]="registerData.accountType === 'INDIVIDUAL'" (click)="registerData.accountType = 'INDIVIDUAL'">
                <span class="material-symbols-rounded">person</span>
                Individual
            </button>
            <button type="button" [class.active]="registerData.accountType === 'ORGANIZATION'" (click)="registerData.accountType = 'ORGANIZATION'">
                <span class="material-symbols-rounded">corporate_fare</span>
                Organization
            </button>
        </div>

        <form class="authForm" (ngSubmit)="onSubmit()">
            <div class="formField">
                <label for="fullName">Full Name</label>
                <div class="inputWrapper">
                    <span class="material-symbols-rounded">person</span>
                    <input type="text" id="fullName" name="fullName" [(ngModel)]="registerData.fullName" placeholder="John Doe" required aria-label="Full Name">
                </div>
            </div>

            <div class="formField">
                <label for="username">Username</label>
                <div class="inputWrapper">
                    <span class="material-symbols-rounded">badge</span>
                    <input type="text" id="username" name="username" [(ngModel)]="registerData.username" placeholder="johndoe" required aria-label="Username">
                </div>
            </div>

            <div class="formField">
                <label for="email">Email Address</label>
                <div class="inputWrapper">
                    <span class="material-symbols-rounded">mail</span>
                    <input type="email" id="email" name="email" [(ngModel)]="registerData.email" placeholder="name@company.com" required aria-label="Email Address">
                </div>
            </div>
            
            <div class="formField">
                <label for="password">Password</label>
                <div class="inputWrapper">
                    <span class="material-symbols-rounded">lock</span>
                    <input type="password" id="password" name="password" [(ngModel)]="registerData.password" placeholder="Min. 8 characters" required aria-label="Password">
                </div>
            </div>

            <button type="submit" class="submitBtn" [disabled]="isLoading">
                <span>{{ isLoading ? 'Creating Account...' : 'Get Started' }}</span>
                <span class="material-symbols-rounded" *ngIf="!isLoading">rocket_launch</span>
                <div class="spinner" *ngIf="isLoading"></div>
            </button>
        </form>

        <div class="authFooter">
            <p>Already have an account? <a routerLink="/login">Sign in</a></p>
        </div>
    </div>
</div>
