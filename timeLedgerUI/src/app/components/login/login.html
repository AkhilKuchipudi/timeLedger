<div class="landingPage">
  <!-- Top Navigation Header -->
  <header class="landingHeader">
    <div class="landingLogo">
      <span class="material-symbols-rounded logoIcon">timeline</span>
      <span class="logoText">TimeLedger</span>
    </div>
    
    <nav class="landingNav">
      <a class="navItem active">Home</a>
      <a class="navItem">About</a>
      <a class="navItem">Top-up</a>
      <a class="navItem">Help</a>
    </nav>
    
    <div class="headerActions">
      <a routerLink="/login" class="actionBtn active">Sign In</a>
      <a routerLink="/register" class="registerBtn">Register</a>
    </div>
  </header>

  <!-- Split Screen Content -->
  <div class="landingContent">
    <!-- Left Hero Section -->
    <div class="heroSection">
      <div class="heroText">
        <h1 class="heroTitle">Welcome to our Community</h1>
        <p class="heroSubtitle">A whole new productive journey starts right here</p>
      </div>
      
      <!-- Generated 3D Illustration -->
      <div class="illustrationWrapper">
        <img src="/login_hero.png" alt="Welcome Illustration" class="heroImage" />
      </div>
      
      <!-- Store Download Badges -->
      <div class="downloadBadges">
        <a class="storeBtn">
          <!-- Custom SVG for Apple Logo -->
          <svg class="storeIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.5-.64.74-1.2 1.88-1.05 2.99 1.12.09 2.26-.59 3-1.43z"/>
          </svg>
          <div class="storeBtnText">
            <span class="smallText">Download on the</span>
            <span class="largeText">App Store</span>
          </div>
        </a>
        
        <a class="storeBtn">
          <!-- Custom SVG for Google Play Logo -->
          <svg class="storeIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 20.285V3.715L14.733 12 3 20.285zm1.5-15.545l8.733 6.13L4.5 17.001v-12.26zm9.845 7.147L18.4 9.176l-3.355 2.361-1.512.35 1.512.35zM4.5 3.498l11.4 8.002 2.5 1.761-13.9-9.763z"/>
          </svg>
          <div class="storeBtnText">
            <span class="smallText">Get it on</span>
            <span class="largeText">Google Play</span>
          </div>
        </a>
      </div>
    </div>

    <!-- Right Login Section -->
    <div class="loginSection">
      <div class="glassPanel loginCard">
        <!-- Account Type Tab Toggle -->
        <div class="accountTypeToggle">
          <button type="button" [class.active]="credentials.accountType === 'INDIVIDUAL'" (click)="credentials.accountType = 'INDIVIDUAL'">
            <span class="material-symbols-rounded">person</span>
            Individual
          </button>
          <button type="button" [class.active]="credentials.accountType === 'ORGANIZATION'" (click)="credentials.accountType = 'ORGANIZATION'">
            <span class="material-symbols-rounded">corporate_fare</span>
            Organization
          </button>
        </div>

        <form class="authForm" (submit)="onSubmit()">
          <!-- Email / Username field -->
          <div class="inputField">
            <div class="inputWrapper">
              <span class="material-symbols-rounded inputIcon">mail</span>
              <input type="text" id="username" name="username" [(ngModel)]="credentials.username" placeholder="Enter your email address or username" required aria-label="Username">
            </div>
          </div>
          
          <!-- Password field -->
          <div class="inputField">
            <div class="inputWrapper">
              <span class="material-symbols-rounded inputIcon">lock</span>
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="credentials.password" placeholder="Password" required aria-label="Password">
              <button type="button" class="visibilityToggle" (click)="showPassword = !showPassword">
                <span class="material-symbols-rounded">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>

          <!-- Keep me login & Recovery Password -->
          <div class="formOptions">
            <label class="checkboxContainer">
              <input type="checkbox" name="keepMeLoggedIn" [(ngModel)]="keepMeLoggedIn">
              <span class="checkmark"></span>
              Keep me login
            </label>
            <a routerLink="/forgot-password" class="forgotLink">Recovery Password</a>
          </div>

          <!-- Error message if any -->
          <div *ngIf="error" class="errorMessage">
            {{error}}
          </div>

          <!-- SIGN IN Button -->
          <button type="submit" class="primaryButton" style="padding: 1.05rem; font-size: 1rem; margin-top: 0.5rem; border-radius: 12px;">
            <span>SIGN IN</span>
            <span class="material-symbols-rounded">login</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="authDivider">
          <span class="dividerLine"></span>
          <span class="dividerText">or continue with</span>
          <span class="dividerLine"></span>
        </div>

        <!-- Social Buttons -->
        <div class="socialRow">
          <button class="socialBtn" type="button">
            <svg class="socialIcon" viewBox="0 0 24 24" width="24" height="24">
              <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114A5.59 5.59 0 0 1 8.4 12.925a5.59 5.59 0 0 1 5.591-5.593c2.474 0 4.33 1.025 5.244 1.9l3.238-3.237C20.218 3.862 17.377 2.4 14 2.4a9.6 9.6 0 0 0-9.6 9.6 9.6 9.6 0 0 0 9.6 9.6c5.293 0 9.6-3.81 9.6-9.6 0-.623-.057-1.226-.16-1.715H12.24Z"/>
            </svg>
          </button>
          <button class="socialBtn" type="button">
            <svg class="socialIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.5-.64.74-1.2 1.88-1.05 2.99 1.12.09 2.26-.59 3-1.43z"/>
            </svg>
          </button>
          <button class="socialBtn" type="button">
            <svg class="socialIcon" viewBox="0 0 24 24" width="24" height="24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
